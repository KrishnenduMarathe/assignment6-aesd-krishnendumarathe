name: assignment-test
on:
  push:
    tags-ignore:
      - '*'
    branches:
      - '*'
jobs:
    full-test:
      runs-on: self-hosted
      steps:
        - uses: actions/checkout@v3
          with:
            clean: false
            submodules: 'recursive'

        - uses: webfactory/ssh-agent@v0.5.4
          with:
            ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

        - name: Install dependencies & Run build
          timeout-minutes: 600
          run: |
            docker run --rm \
            -v $SSH_AUTH_SOCK:/ssh-agent -e SSH_AUTH_SOCK=/ssh-agent \
            -e GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no" \
            -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} \
            cuaesd/aesd-autotest:assignment6-yocto \
            --workdir=${GITHUB_WORKSPACE} \
            bash -c "cd ${GITHUB_WORKSPACE} && \
            apt update && \
            apt install -y nodejs openssh-client sshpass build-essential chrpath cpio debianutils diffstat file gawk gcc git iputils-ping libacl1 libcrypt-dev locales python3 python3-git python3-jinja2 python3-pexpect python3-pip python3-subunit socat texinfo unzip wget xz-utils zstd qemu-system-arm qemu-efi-aarch64 cloud-image-utils netcat valgrind && \
            echo 'en_US.UTF-8 UTF-8' >> /etc/locale.gen && \
            locale-gen && \
            ./build.sh"

        - name: Cleanup
          if: always()
          run: |
            ssh-add -D

        - name: Run full test
          timeout-minutes: 15
          run: |
            docker run --rm \
            -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} \
            cuaesd/aesd-autotest:assignment6-yocto \
            --workdir=${GITHUB_WORKSPACE} \
            ./full-test.sh
